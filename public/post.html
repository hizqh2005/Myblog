<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 - 我的博客</title>
  <link rel="icon" href="icon.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container post-page">
    <header class="site-header">
      <div class="site-title"><a href="./">我的博客</a></div>
      <nav>
        <a href="./">首页</a>
        <a href="editor.html">写文章</a>
      </nav>
    </header>

    <main id="main">
      <div class="empty-tip">加载中…</div>
    </main>
  </div>

  <script src="js/markdown.js"></script>
  <script src="js/store.js"></script>
  <script>
    function formatDate(ts) {
      var d = new Date(ts);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var main = document.getElementById('main');
    var id = new URLSearchParams(location.search).get('id');

    if (!id) {
      main.innerHTML = '<div class="empty-tip">缺少文章 ID。<a href="./">返回首页</a></div>';
    } else {
      store.get(id).then(function (post) {
        if (!post) {
          main.innerHTML = '<div class="empty-tip">文章不存在。<a href="./">返回首页</a></div>';
          return;
        }
        document.title = post.title + ' - 我的博客';
        main.innerHTML =
          '<a class="back-link" href="./">&larr; 返回首页</a>' +
          '<article class="post">' +
          '<h1>' + escapeHtml(post.title) + '</h1>' +
          '<div class="meta">发布于 ' + formatDate(post.createdAt) +
          (post.updatedAt > post.createdAt ? '(编辑于 ' + formatDate(post.updatedAt) + ')' : '') +
          '</div>' +
          '<div class="markdown-body">' + markdown.toHtml(post.content) + '</div>' +
          '<div class="post-actions">' +
          '<a href="editor.html?id=' + post.id + '">编辑</a>' +
          '</div>' +
          '</article>';
      }).catch(function (e) {
        main.innerHTML = '<div class="empty-tip">加载失败:' + escapeHtml(e.message) + '</div>';
      });
    }
  </script>
</body>
</html>
